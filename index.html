<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Panduan surat dan dokumen untuk menghantar program Persatuan Mahasiswa Harmoni UiTM Shah Alam.">
<title>Panduan Program Harmoni</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style id="page-style">
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: Harmoni Malaysia look. Navy-to-royal header band with pill tabs, then one centred working column (max 920px) on a cool lavender ground. */
:root{
  --bg:#F3F4FB;--surface:#FFFFFF;--ink:#1C2547;--muted:#545D7A;--line:#DCE0EF;--brand:#253682;--brand-2:#2A57A8;--brand-ink:#FFFFFF;--brand-muted:#C9D3F0;--sky:#4AA8E8;--sky-ink:#0F2A4A;--accent:#1F6FB5;--warn:#8A520B;--warn-soft:#FBEBCB;--ok:#2B7149;--ok-soft:#DCEFE3;--danger:#A3322A;--tint:#E6EAFA;
  --display:'Inter',Arial,sans-serif;--text:'Inter',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1330;--surface:#171E42;--ink:#E7EAF7;--muted:#A3ABCB;--line:#2C3561;--brand:#1A2766;--brand-2:#22448C;--brand-ink:#FFFFFF;--brand-muted:#B7C3EC;--sky:#5DB4EE;--sky-ink:#0B1F38;--accent:#7CC2F2;--warn:#EBAA4C;--warn-soft:#3A2B12;--ok:#6CC490;--ok-soft:#16352A;--danger:#F08A80;--tint:#1E2752;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1330;--surface:#171E42;--ink:#E7EAF7;--muted:#A3ABCB;--line:#2C3561;--brand:#1A2766;--brand-2:#22448C;--brand-ink:#FFFFFF;--brand-muted:#B7C3EC;--sky:#5DB4EE;--sky-ink:#0B1F38;--accent:#7CC2F2;--warn:#EBAA4C;--warn-soft:#3A2B12;--ok:#6CC490;--ok-soft:#16352A;--danger:#F08A80;--tint:#1E2752;color-scheme:dark}
*{box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
:root[data-theme="dark"] h2{color:var(--ink)}
body{background:linear-gradient(180deg,var(--tint) 0,var(--bg) 480px) var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--brand-ink)}
header.top .wrap{padding-block:22px 0;display:flex;flex-direction:column;gap:6px}
header.top .logo{width:clamp(160px,22vw,200px);height:auto;margin-bottom:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.01em;font-size:clamp(26px,4.4vw,36px);line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--brand-muted);margin:0;max-width:62ch}
nav.tabs{display:flex;gap:6px;margin-top:20px;padding-bottom:16px;overflow-x:auto}
nav.tabs a{color:var(--brand-muted);text-decoration:none;font-weight:600;font-size:14px;padding:8px 16px;border-radius:8px;white-space:nowrap}
nav.tabs a:hover{color:var(--brand-ink)}
nav.tabs a[aria-current="page"]{background:rgba(10,18,60,.45);color:var(--brand-ink)}
nav.tabs a:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
h2{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand);margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px}
.banner.warn{background:var(--warn-soft);border-left:4px solid var(--warn)}
.banner.ok{background:var(--ok-soft)}
.status{font-size:13px;color:var(--muted);min-height:20px}
/* Questions */
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q label.ql{font-weight:600;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{border-color:var(--brand-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{border-color:var(--brand-muted)}}
/* Steps */
.steps{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:15px}
.step{position:relative;padding:0 0 26px 30px}
.step:last-child{padding-bottom:4px}
.step .num{position:absolute;left:-16px;top:0;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-family:var(--display);font-weight:600;display:grid;place-items:center;font-size:14px}
.step.after .num{background:var(--sky);color:var(--sky-ink)}
.step .when{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.step .shead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;padding-top:3px}
.docs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.doc:first-child{border-top:none}
.doc .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc .dn{font-weight:500}
.doc .dnote{font-size:13px;color:var(--muted)}
.doc.done .dn{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-soft);color:var(--ink);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tpl{font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
:root[data-theme="dark"] .tpl{color:var(--brand-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tpl{color:var(--brand-muted)}}
button.tpl{font-family:inherit;cursor:pointer}
button.tpl:disabled{opacity:.6;cursor:wait}
.tpl.none{color:var(--muted);font-weight:500;border-style:dashed;background:transparent}
.skip{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:0 0 26px 30px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none;margin:0;cursor:pointer}
input[type=checkbox]:disabled{cursor:not-allowed}
/* Buttons & forms */
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--sky);background:var(--sky);color:var(--sky-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 220px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=date],input[type=url]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
/* Program cards */
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .chead{display:flex;gap:14px;align-items:center;padding:16px 18px;cursor:pointer;width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left}
.card .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pill{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.count{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count.full{color:var(--ok)}
.cbody{border-top:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}
.chev{transition:transform .2s;color:var(--muted)}
.card.open .chev{transform:rotate(90deg)}
.empty{text-align:center;padding:36px 18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.trow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.trow:first-child{border-top:none}
.trow .dn{flex:1 1 200px;min-width:0;font-weight:500}
.trow input{flex:1 1 280px}
a{color:var(--brand)}
:root[data-theme="dark"] a{color:var(--brand-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:var(--brand-muted)}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
@media (max-width:520px){.doc{flex-wrap:wrap}.doc .dt{flex-basis:calc(100% - 40px)}.doc .tpl{margin-left:32px}}

/* Preview modal */
.pv{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pv-backdrop{position:absolute;inset:0;background:rgba(10,16,48,.62)}
.pv-box{position:relative;background:var(--surface);color:var(--ink);border-radius:16px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pv-head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.pv-ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pv-ht h2{font-size:19px}
.pv-ht span{font-size:13px}
.pv-x{font:inherit;font-size:16px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none}
.pv-body{overflow-y:auto;background:var(--bg);padding:18px}
#pv-pages{display:flex;flex-direction:column;gap:18px;align-items:center}
#pv-pages figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
#pv-pages img{width:100%;max-width:720px;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#pv-pages figcaption{font-size:12px;color:var(--muted)}
.pv-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line)}
.pv-note{font-size:12px;flex:1 1 220px}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:520px){.pv{padding:0}.pv-box{border-radius:0;height:100%}.pv-body{padding:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="pv" class="pv" hidden role="dialog" aria-modal="true" aria-labelledby="pv-title">
<div class="pv-backdrop" data-act="pvclose"></div>
<div class="pv-box">
<div class="pv-head"><div class="pv-ht"><h2 id="pv-title">Templat</h2><span id="pv-meta" class="muted"></span></div><button type="button" class="pv-x" id="pv-close" data-act="pvclose" aria-label="Tutup">✕</button></div>
<div class="pv-body" id="pv-body"><div id="pv-pages"></div></div>
<div class="pv-foot"><span class="muted pv-note">Pratonton ini anggaran. Fail sebenar mungkin sedikit berbeza susun aturnya.</span><span class="row"><button type="button" class="btn ghost" data-act="pvclose">Tutup</button><a class="btn" id="pv-dl" href="#" download>Muat turun</a><a class="btn" id="pv-gd" href="#" target="_blank" rel="noopener" hidden>Buat salinan (Google Docs) ↗</a></span></div>
</div>
</div>

<script id="page-script">
(function(){
var DOCS={
  kk:"Kertas kerja",kkhema:"Kertas kerja (format HEMA)",skp:"Surat kelulusan dan peruntukan",ska:"Surat kelulusan menjalankan aktiviti",
  slkk:"Surat pernyataan sebab lewat kertas kerja",spin:"Surat kelulusan pindaan program",poster:"Poster / banner program",
  peserta:"Senarai peserta program",skprog:"Surat kelulusan program (dari HEP)",
  lbg:"Laporan bergambar program",lkew:"Laporan implikasi kewangan program",slsp:"Surat pernyataan sebab lewat surat-surat program"
};
var ROUTES={hema:"Hantar kepada HEMA",hep:"Hantar kepada HEP","hep-k":"Hantar kepada HEP","hep-t":"Hantar kepada HEP"};
var KEYNOTE={peserta:"Mesti dicop oleh penasihat program.",skprog:"Dikeluarkan oleh HEP. Tunggu kelulusan sebelum meneruskan.",spin:"Dikeluarkan oleh HEP. Tunggu kelulusan pindaan sebelum meneruskan."};
var FROM_HEP={skprog:1,spin:1};
var NOTE_RM0="Program tiada kewangan? Tulis RM0.00 di bahagian Implikasi Kewangan.";
var FILES={
  kk:{f:"kertas-kerja.docx",n:"SAMPLE KERTAS KERJA PROGRAM [NAMA].docx",pv:"kertas-kerja",pg:7,gd:"1QxOjeK-yz_cGBa6uylzJtgD5mw88CBPPANboiTEM_T4"},
  kkhema:{f:"contoh-kertas-kerja-hema.pdf",n:"Contoh Kertas Kerja HEMA - Harmoni Vibe.pdf",pv:"contoh-kertas-kerja-hema",pg:8},
  skp:{f:"surat-kelulusan-peruntukan.docx",n:"SAMPLE SURAT PERMOHONAN KELULUSAN DAN PERUNTUKAN PROGRAM [NAMA].docx",pv:"surat-kelulusan-peruntukan",pg:2,gd:"1IrpZ0tlo_gOWlNjz5_Zuv_9799K_KDGjfxCVzBamWn4"},
  ska:{f:"surat-kelulusan-luar-uitm.docx",n:"SAMPLE SURAT KELULUSAN PROGRAM LUAR UITM [NAMA].docx",pv:"surat-kelulusan-luar-uitm",pg:2,gd:"1-uysCTZI7mLXnnS7kpSbiZy2rZHFCgLl3lvcAd_eZBY"},
  slkk:{f:"surat-lewat-kertas-kerja.docx",n:"SAMPLE SURAT PERNYATAAN SEBAB KELEWATAN KERTAS KERJA [NAMA].docx",pv:"surat-lewat-kertas-kerja",pg:2,gd:"1Oes-xWS6qk8BG211cP_iGPl9KIvPu1jvRnISNY7fZvo"},
  poster:{f:"contoh-poster.jpg",n:"Contoh Poster Harmoni.jpg",label:"Contoh",img:"templates/contoh-poster.jpg"},
  lbg:{f:"laporan-bergambar.docx",n:"SAMPLE LAPORAN BERGAMBAR PROGRAM [NAMA].docx",pv:"laporan-bergambar",pg:3,gd:"1nabh6JTAhOTVyaHVS0PccVhDnJc6iUkuVBeH77UglHI"},
  lkew:{f:"laporan-implikasi-kewangan.docx",n:"SAMPLE LAPORAN IMPLIKASI KEWANGAN PROGRAM [NAMA].docx",pv:"laporan-implikasi-kewangan",pg:1,gd:"10DS4HAT34IGqKwOYaOETKsBBYmUiKUcz-yKa2vZJokM"},
  peserta:{f:"senarai-peserta.docx",n:"SAMPLE SENARAI KEHADIRAN PELAJAR PROGRAM [NAMA].docx",pv:"senarai-peserta",pg:2},
  slsp:{f:"surat-lewat-surat-program.docx",n:"SAMPLE SURAT PERNYATAAN SEBAB KELEWATAN SURAT-SURAT PROGRAM [NAMA].docx",pv:"surat-lewat-surat-program",pg:2,gd:"18baBfcIzhyiwieiDBQuoKEy4BdpQj9wnfQREy7vP6-k"}
};


function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
try{localStorage.removeItem("hp-state");localStorage.removeItem("hp-open")}catch(e){}
var ui={answers:lsGet("hp-answers",{route:"hep",date:"",outside:false,transport:false,pindaan:false})};
if(ui.answers.route!=="hema")ui.answers.route="hep";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function isHep(a){return a.route!=="hema"}

function daysLeft(a){
  if(!a.date)return null;
  var d=new Date(a.date+"T00:00:00");if(isNaN(d))return null;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function lateState(a){var n=daysLeft(a);return n===null?null:n<30}
function fmtDate(d){try{return d.toLocaleDateString("ms-MY",{day:"numeric",month:"long",year:"numeric"})}catch(e){return ""}}
function lewatItem(id,key,a){
  var l=lateState(a);
  if(l===false)return null;
  return l?{id:id,key:key,tag:"Lewat",note:"Diperlukan kerana kurang 30 hari sebelum program."}:{id:id,key:key,tag:"Jika lewat",note:"Hanya jika dihantar kurang 30 hari sebelum program."};
}
function steps(a){
  var out=[];
  if(!isHep(a)){
    out.push({n:1,title:"Kertas kerja",when:"Sebelum program",items:[{id:"1-kk",key:"kkhema",note:ROUTES.hema}]});
    return out;
  }
  out.push({n:1,title:"Kertas kerja",when:"Sebelum program",items:[{id:"1-kk",key:"kk",note:ROUTES.hep+". "+NOTE_RM0}]});
  var s2=[{id:"2-skp",key:"skp"}];
  if(a.outside)s2.push({id:"2-ska",key:"ska",note:"Program di luar UiTM. Hantar ke Bangunan Canselori bersama kertas kerja."});
  out.push({n:2,title:"Surat kelulusan",when:"Sebelum program",items:s2});
  var s3=[{id:"3-kk",key:"kk",note:"Muat naik di MyHEP. "+NOTE_RM0},{id:"3-skp",key:"skp"}];
  if(a.outside)s3.push({id:"3-ska",key:"ska",note:"Program di luar UiTM"});
  var l3=lewatItem("3-slkk","slkk",a);if(l3)s3.push(l3);
  if(a.pindaan)s3.push({id:"3-spin",key:"spin",tag:"Pindaan"});
  s3.push({id:"3-poster",key:"poster"});
  out.push({n:3,title:"Hantar di MyHEP",when:"Sebelum program",link:true,items:s3});
  if(a.transport){
    var s4=[{id:"4-peserta",key:"peserta"},{id:"4-skprog",key:"skprog"}];
    if(a.pindaan)s4.push({id:"4-spin",key:"spin",tag:"Pindaan"});
    out.push({n:4,title:"Pengangkutan UiTM",when:"Sebelum program",items:s4});
  }
  var s5=[{id:"5-lbg",key:"lbg"},{id:"5-lkew",key:"lkew"}];
  var l5=lewatItem("5-slsp","slsp",a);if(l5)s5.push(l5);
  out.push({n:5,title:"Laporan selepas program",when:"Selepas program",after:true,items:s5});
  return out;
}
function allItems(a){var r=[];steps(a).forEach(function(s){r=r.concat(s.items)});return r}

function tplBtn(key){
  var f=FILES[key];
  if(FROM_HEP[key])return '<span class="tpl none">Dari HEP</span>';
  if(f)return '<button type="button" class="tpl" data-act="pv" data-k="'+key+'">'+(f.label?"Lihat contoh":"Lihat templat")+'</button>';
  return '<span class="tpl none">Tiada templat</span>';
}
function pages(f){var r=[];if(f.img)r.push(f.img);else for(var i=1;i<=f.pg;i++)r.push("preview/"+f.pv+"-"+i+".jpg");return r}
var lastFocus=null;
function openPreview(key,from){
  var f=FILES[key],m=document.getElementById("pv");if(!f||!m)return;lastFocus=from||null;
  var ext=f.f.split(".").pop().toUpperCase();
  document.getElementById("pv-title").textContent=DOCS[key];
  document.getElementById("pv-meta").textContent=(f.img?"Gambar":ext==="PDF"?"Contoh PDF":"Templat Word")+(f.pg?" · "+f.pg+" halaman":"");
  var dl=document.getElementById("pv-dl");dl.href="templates/"+f.f;dl.setAttribute("download",f.n);
  dl.textContent="Muat turun "+(f.img?"gambar":ext==="DOCX"?"(Word)":"("+ext+")");
  var gd=document.getElementById("pv-gd");
  if(f.gd){gd.href="https://docs.google.com/document/d/"+f.gd+"/copy";gd.hidden=false;dl.className="btn ghost"}else{gd.hidden=true;dl.className="btn"}
  document.getElementById("pv-pages").innerHTML=pages(f).map(function(src,i,a){return '<figure><img src="'+src+'" alt="'+esc(DOCS[key])+', halaman '+(i+1)+' daripada '+a.length+'" loading="lazy">'+(a.length>1?'<figcaption>Halaman '+(i+1)+' / '+a.length+'</figcaption>':'')+'</figure>'}).join("");
  document.getElementById("pv-body").scrollTop=0;
  m.hidden=false;document.body.style.overflow="hidden";document.getElementById("pv-close").focus();
}
function closePreview(){var m=document.getElementById("pv");if(!m||m.hidden)return;m.hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function renderSteps(a){
  var html='<div class="steps">';
  steps(a).forEach(function(s){
    if(s.n===5&&!a.transport)html+='<p class="skip">Langkah 4 (pengangkutan UiTM) tidak diperlukan.</p>';
    html+='<div class="step'+(s.after?" after":"")+'"><span class="num">'+s.n+'</span><div class="shead"><span class="when">'+s.when+'</span><h3>'+esc(s.title)+'</h3>'+
      (s.link?'<span class="muted" style="font-size:14px">Laman: <a href="https://myhep.uitm.edu.my" target="_blank" rel="noopener">myhep.uitm.edu.my</a></span>':"")+'</div><div class="docs">';
    s.items.forEach(function(it){
      html+='<div class="doc"><div class="dt"><span class="dn">'+esc(DOCS[it.key])+'</span>'+((it.note||KEYNOTE[it.key])?'<span class="dnote">'+esc([it.note,KEYNOTE[it.key]].filter(Boolean).join(" "))+'</span>':"")+'</div>'+
        (it.tag?'<span class="tag">'+esc(it.tag)+'</span>':"")+tplBtn(it.key)+'</div>';
    });
    html+='</div></div>';
  });
  if(!isHep(a))html+='<p class="skip" style="margin-bottom:0">Proses tamat di sini. Langkah 2 hingga 5 tidak diperlukan untuk kertas kerja yang dihantar kepada HEMA.</p>';
  return html+'</div>';
}

function seg(name,opts,val){
  return '<div class="seg" role="group">'+opts.map(function(o){return '<button type="button" data-act="ans" data-k="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(String(val)===o[0])+'">'+esc(o[1])+'</button>'}).join("")+'</div>';
}
function questions(a){
  var h='<div class="qs"><div class="q"><label class="ql">Kertas kerja dihantar kepada?</label>'+seg("route",[["hema","HEMA"],["hep","HEP"]],a.route)+'</div>';
  if(isHep(a)){
    h+='<div class="q"><label class="ql" for="q-date">Tarikh program</label><input type="date" id="q-date" value="'+esc(a.date||"")+'" style="max-width:220px"></div>'+
       '<div class="q"><label class="ql">Lokasi program?</label>'+seg("outside",[["false","Dalam UiTM"],["true","Luar UiTM"]],a.outside)+'</div>'+
       '<div class="q"><label class="ql">Guna pengangkutan UiTM?</label>'+seg("transport",[["false","Tidak"],["true","Ya"]],a.transport)+'</div>'+
       '<div class="q"><label class="ql">Ada pindaan program?</label>'+seg("pindaan",[["false","Tiada"],["true","Ada"]],a.pindaan)+'</div>';
  }
  return h+'</div>';
}
function deadlineBox(a){
  if(!isHep(a))return "";
  var n=daysLeft(a);
  if(n===null)return '<div class="banner"><span><b>Tempoh 30 hari:</b> semua surat mesti dihantar sekurang-kurangnya 30 hari sebelum program. Jika kurang, surat pernyataan sebab lewat perlu disediakan. Masukkan tarikh program untuk semak.</span></div>';
  var d=new Date(a.date+"T00:00:00");d.setDate(d.getDate()-30);
  if(n<0)return '<div class="banner"><span><b>Tarikh program sudah lepas.</b> Semak semula tarikh yang dimasukkan.</span></div>';
  if(n<30)return '<div class="banner warn"><span><b>Lewat:</b> program dalam '+n+' hari, kurang daripada 30 hari. Surat pernyataan sebab lewat perlu disediakan (ditanda “Lewat” di bawah). Tarikh akhir hantar ialah '+esc(fmtDate(d))+'.</span></div>';
  var left=n-30;
  return '<div class="banner ok"><span><b>Masih dalam tempoh.</b> Hantar semua surat selewat-lewatnya '+esc(fmtDate(d))+' ('+(left===0?"hari ini":"lagi "+left+" hari")+'). Surat pernyataan sebab lewat tidak diperlukan.</span></div>';
}

function viewSemak(){
  var a=ui.answers,n=allItems(a).length;
  var h='<section class="panel"><div><h2>Apa yang program awak perlukan?</h2><p class="muted" style="margin:4px 0 0">Jawab soalan di bawah. Senarai dokumen dikemas kini serta-merta.</p></div>'+questions(a)+deadlineBox(a)+'</section>';
  h+='<section style="display:flex;flex-direction:column;gap:16px"><h2>'+n+' dokumen diperlukan</h2>'+renderSteps(a)+'</section>';
  return h;
}

function viewTemplat(){
  var keys=Object.keys(DOCS),missing=keys.filter(function(k){return !FILES[k]});
  var h='<div><h2>Templat dan contoh surat</h2><p class="muted" style="margin:4px 0 0">Lihat templat dahulu, kemudian muat turun. Gantikan bahagian bertanda [....] dengan maklumat program.</p></div>';
  h+='<div class="tlist">'+keys.filter(function(k){return FILES[k]}).map(function(k){return '<div class="trow"><span class="dn">'+esc(DOCS[k])+'</span>'+tplBtn(k)+'</div>'}).join("")+'</div>';
  var hep=missing.filter(function(k){return FROM_HEP[k]});missing=missing.filter(function(k){return !FROM_HEP[k]});
  function row(k){return '<div class="trow"><div class="dn" style="display:flex;flex-direction:column;gap:2px"><span>'+esc(DOCS[k])+'</span>'+(KEYNOTE[k]?'<span class="muted" style="font-size:13px;font-weight:400">'+esc(KEYNOTE[k])+'</span>':"")+'</div>'+tplBtn(k)+'</div>'}
  h+='<div><h2>Dikeluarkan oleh HEP</h2><p class="muted" style="margin:4px 0 0">Surat ini tiada templat. Tunggu HEP mengeluarkannya selepas permohonan diluluskan.</p></div>';
  h+='<div class="tlist">'+hep.map(row).join("")+'</div>';
  h+='<div><h2>Belum ada templat</h2><p class="muted" style="margin:4px 0 0">Dokumen ini tiada templat lagi. Rujuk Setiausaha.</p></div>';
  h+='<div class="tlist">'+missing.map(row).join("")+'</div>';
  if(false)h+='<div class="tlist">'+missing.map(function(k){return '<div class="trow"><span class="dn">'+esc(DOCS[k])+'</span>'+tplBtn(k)+'</div>'}).join("")+'</div>';
  return h;
}

function route(){var r=(location.hash||"").replace("#","");return r==="templat"?"templat":"semak"}
function render(){
  var r=route(),app=document.getElementById("app"),y=window.scrollY;
  var tabs=[["semak","Semak keperluan"],["templat","Templat"]];
  var h='<header class="top"><div class="wrap"><img class="logo" src="logo-harmoni-white.png" alt="Persatuan Mahasiswa Harmoni UiTM Shah Alam" width="160" height="64"><h1>Panduan Program</h1>'+
    '<p class="lede">Surat dan dokumen untuk menghantar program, dari kertas kerja hingga laporan selepas program.</p>'+
    '<nav class="tabs">'+tabs.map(function(t){return '<a href="#'+t[0]+'"'+(r===t[0]?' aria-current="page"':"")+'>'+t[1]+'</a>'}).join("")+'</nav></div></header><main><div class="wrap">';
  h+=r==="templat"?viewTemplat():viewSemak();
  h+='</div></main>';
  app.innerHTML=h;
  window.scrollTo(0,y);
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t)return;var act=t.getAttribute("data-act");
  if(act==="pv"){openPreview(t.getAttribute("data-k"),t);return}
  if(act==="pvclose"){closePreview();return}
  if(act==="ans"){var k=t.getAttribute("data-k"),v=t.getAttribute("data-v");ui.answers[k]=k==="route"?v:v==="true";lsSet("hp-answers",ui.answers);render()}
});
document.addEventListener("change",function(ev){
  if(ev.target.id!=="q-date")return;
  ui.answers.date=ev.target.value||"";lsSet("hp-answers",ui.answers);render();
  var el=document.getElementById("q-date");if(el)el.focus();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePreview()});
window.addEventListener("hashchange",function(){render()});
render();

})();
</script>
</body>
</html>
